<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマブラ勝率計算機</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <h1>スマブラ勝率計算機</h1>
        <p id="instruction-text">使用キャラクターを選択してください</p>
    </header>

    <main class="main-content">
        <!-- キャラクター選択枠（縦7行×横13列、最下段左右2つ空き） -->
        <div id="roster-view" class="roster-container">
            <div class="roster-header">
                <div id="selected-player-display" class="selected-player-display hidden">
                    使用キャラ: <span id="player-name-text"></span>
                </div>
                <button id="back-btn" class="back-btn hidden">使用キャラ選択に戻る</button>
            </div>
            <div id="character-roster" class="roster">
                <!-- JavaScriptでボタンを生成します -->
            </div>
        </div>

        <!-- 勝敗記録画面（初期は非表示） -->
        <div id="match-view" class="match-container hidden">
            <div class="match-header">
                <button id="back-to-roster-btn" class="back-btn">← キャラ選択に戻る</button>
                <h2 id="vs-text" class="vs-text">マリオ VS ドンキーコング</h2>
            </div>

            <div class="action-buttons">
                <button id="win-btn" class="result-btn win-btn">勝ち</button>
                <button id="loss-btn" class="result-btn loss-btn">負け</button>
            </div>

            <div class="stage-select-container">
                <div class="stage-buttons">
                    <button id="stage-fd-btn" class="stage-btn active">終点</button>
                    <button id="stage-bf-btn" class="stage-btn">戦場</button>
                    <button id="stage-sbf-btn" class="stage-btn">小戦場</button>
                    <button id="stage-other-btn" class="stage-btn">その他</button>
                </div>
            </div>

            <div class="stats-section">
                <!-- 総合勝率表示領域 (詳細勝率画面と同じレイアウトを使用) -->
                <div class="detail-overview">
                    <div class="detail-overview-item">
                        <span class="detail-overview-label">直近10戦 総合勝率</span>
                        <span id="rate-10" class="detail-overview-value">--%</span>
                        <button id="match-breakdown-10-btn" class="breakdown-btn hidden">内訳</button>
                    </div>
                    <div class="detail-overview-item">
                        <span class="detail-overview-label">直近50戦 総合勝率</span>
                        <span id="rate-50" class="detail-overview-value">--%</span>
                        <button id="match-breakdown-50-btn" class="breakdown-btn hidden">内訳</button>
                    </div>
                </div>
            </div>

            <!-- 内訳インライン表示領域 -->
            <div id="match-breakdown-inline-container" class="breakdown-inline-container hidden">
                <div class="breakdown-inline-header">
                    <h4 id="match-breakdown-title">直近10戦 ステージ別</h4>
                </div>
                <ul id="match-breakdown-list" class="history-list breakdown-list">
                    <!-- Java Scriptで生成 -->
                </ul>
            </div>

            <!-- ステージ別内訳インライン表示領域 -->
            <div id="match-stage-breakdown-inline-container" class="breakdown-inline-container hidden" style="margin-top: 10px;">
                <div class="breakdown-inline-header">
                    <h4 id="match-stage-breakdown-title">ステージ 内訳</h4>
                </div>
                <ul id="match-stage-breakdown-list" class="history-list breakdown-list">
                    <!-- JavaScriptで生成 -->
                </ul>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <h3>対戦履歴 <span id="history-count">(0)</span></h3>
                    <button id="clear-all-history-btn" class="clear-all-btn">履歴全削除</button>
                </div>
                <ul id="history-list" class="history-list">
                    <!-- Java Scriptで履歴を生成 -->
                </ul>
            </div>
        </div>

        <!-- 全キャラ勝率画面（初期は非表示） -->
        <div id="ranking-view" class="match-container hidden">
            <div class="match-header">
                <button id="back-from-ranking-btn" class="back-btn">← キャラ選択に戻る</button>
                <h2 class="vs-text">全キャラ勝率ランキング</h2>
            </div>

            <div class="action-buttons ranking-tabs">
                <button id="tab-10-btn" class="result-btn win-btn active-tab">直近10戦</button>
                <button id="tab-50-btn" class="result-btn loss-btn inactive-tab">直近50戦</button>
            </div>

            <div class="history-section">
                <ul id="ranking-list" class="history-list ranking-list">
                    <!-- JavaScriptでランキングを生成 -->
                </ul>
            </div>
        </div>

        <!-- 詳細勝率画面（初期は非表示） -->
        <div id="detail-view" class="match-container hidden">
            <div class="match-header">
                <button id="back-from-detail-btn" class="back-btn">← キャラ選択に戻る</button>
                <h2 id="detail-char-name" class="vs-text">キャラクター詳細勝率</h2>
            </div>

            <!-- 総合勝率表示領域 -->
            <div class="detail-overview">
                <div class="detail-overview-item">
                    <span class="detail-overview-label">直近10戦 総合勝率</span>
                    <span id="detail-rate-10" class="detail-overview-value">--%</span>
                    <button id="breakdown-10-btn" class="breakdown-btn hidden">内訳</button>
                </div>
                <div class="detail-overview-item">
                    <span class="detail-overview-label">直近50戦 総合勝率</span>
                    <span id="detail-rate-50" class="detail-overview-value">--%</span>
                    <button id="breakdown-50-btn" class="breakdown-btn hidden">内訳</button>
                </div>
            </div>

            <!-- 内訳インライン表示領域 -->
            <div id="breakdown-inline-container" class="breakdown-inline-container hidden">
                <div class="breakdown-inline-header">
                    <h4 id="breakdown-title">直近10戦 内訳</h4>
                </div>
                <ul id="breakdown-list" class="history-list breakdown-list">
                    <!-- Java Scriptで履歴を生成 -->
                </ul>
            </div>

            <!-- ステージ別勝率表示領域 -->
            <div id="detail-stage-stats-container" class="breakdown-inline-container" style="margin-top: 10px;">
                <div class="breakdown-inline-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="margin: 0;">ステージ別勝率</h4>
                    <div class="stage-tabs" style="display: flex; gap: 4px;">
                        <button id="stage-tab-50-btn" class="stage-tab-btn active">50戦</button>
                        <button id="stage-tab-10-btn" class="stage-tab-btn">10戦</button>
                    </div>
                </div>
                <ul id="detail-stage-ranking-list" class="history-list breakdown-list">
                    <!-- JavaScriptで生成 -->
                </ul>
            </div>

            <!-- ステージ別内訳インライン表示領域 -->
            <div id="stage-breakdown-inline-container" class="breakdown-inline-container hidden" style="margin-top: 10px;">
                <div class="breakdown-inline-header">
                    <h4 id="stage-breakdown-title">ステージ 内訳</h4>
                </div>
                <ul id="stage-breakdown-list" class="history-list breakdown-list">
                    <!-- JavaScriptで生成 -->
                </ul>
            </div>

            <div class="history-section">
                <!-- マッチアップ別ランキング -->
                <div class="history-header">
                    <h3>有利対面ランキング</h3>
                </div>
                <ul id="detail-ranking-list" class="history-list ranking-list">
                    <!-- JavaScriptでランキングを生成 -->
                </ul>
            </div>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loader"></div>
            <p style="font-weight: bold; color: #4a5568;">通信中...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
